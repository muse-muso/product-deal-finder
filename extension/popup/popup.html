<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Product Deal Finder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <h1 class="title">Product Deal Finder</h1>
      <button type="button" id="settingsBtn" class="settings-btn" title="Options" aria-label="Open options">
        <svg class="settings-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M10 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" fill="currentColor"/>
          <path fill-rule="evenodd" clip-rule="evenodd" d="M8.24 2.5a1.5 1.5 0 0 1 3.52 0l.35.85a6.5 6.5 0 0 0 2.6 1.3l.9.27a1.5 1.5 0 0 1 .9 2.01l-.4.9a6.5 6.5 0 0 0 0 2.54l.4.9a1.5 1.5 0 0 1-.9 2.01l-.9.27a6.5 6.5 0 0 0-2.6 1.3l-.35.85a1.5 1.5 0 0 1-3.52 0l-.35-.85a6.5 6.5 0 0 0-2.6-1.3l-.9-.27a1.5 1.5 0 0 1-.9-2.01l.4-.9a6.5 6.5 0 0 0 0-2.54l-.4-.9a1.5 1.5 0 0 1 .9-2.01l.9-.27a6.5 6.5 0 0 0 2.6-1.3l.35-.85Z" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <section class="track-current">
      <h2>Track current page</h2>
      <p class="hint">Open a product page on a supported retailer, then set your target price and click below.</p>
      <div class="row">
        <label>Target price (AUD)</label>
        <input type="number" id="threshold" min="0" step="0.01" placeholder="e.g. 1800">
      </div>
      <button id="trackPageBtn" class="btn primary">Track this page</button>
      <p id="trackStatus" class="status"></p>
    </section>

    <section class="list-section">
      <h2>Tracked products</h2>
      <div class="list-scroll">
        <ul id="trackedList"></ul>
      </div>
      <p id="emptyList" class="empty">No products tracked yet.</p>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
